services:
  - type: web
    name: researchflow-ai
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    autoDeploy: true
  - type: worker
    name: researchflow-ai-worker
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    dockerCommand: python3 -m app.worker
    autoDeploy: true
